# No `labels:` key. An issue form that assigns a label which does not exist in
# the repository fails on submission, and this repository has no labels
# configured. Add labels here only after creating them.
name: Bug report
description: An agent, skill, workflow or tool does not behave as its definition says it does
title: "bug: "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.

        Before you start: **which tree did you observe this in?** The same
        agents exist in several copies and editing the wrong one changes
        nothing, so the tree is usually the single most useful fact in the
        report. `CONTRIBUTING.md` has the map.

        If the agent simply did not register at all — dispatch failed with
        "agent type not found" — check the file's line endings first. That
        has been the cause five times, and `python sdlc-suite/tools/eol_check.py --check`
        will tell you in a second.

  - type: dropdown
    id: tree
    attributes:
      label: Which tree
      description: Where the definition you were using actually lives.
      options:
        - .claude/ (live)
        - sdlc-suite/ (live, plugin)
        - commandcode-suite/ (port)
        - .kimi-code/ (port)
        - .copilot/ (port)
        - .codex/ (port)
        - .agents/ (port)
        - Not sure / not tree-specific
    validations:
      required: true

  - type: input
    id: subject
    attributes:
      label: Which agent, skill, workflow or tool
      description: The name, and the file path if you have it.
      placeholder: security-engineer — .claude/agents/security-engineer.md
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What the definition says should happen
      description: >
        Quote the line, with its path and line number if you can. A
        definition is the deliverable here, so the discrepancy between what
        it states and what happened is the bug.
      placeholder: |
        .claude/agents/security-engineer.md:12 says the report must open with
        a "Skills loaded" line.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: >
        Paste the real output rather than describing it. If you are reporting
        that a command failed, include the exit code — a runner can print
        "N passed" while exiting 1.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The prompt, command or workflow invocation, and anything needed to set it up.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Harness and version, OS, and Python/Node version if a tool or workflow is involved.
      placeholder: |
        Harness: Claude Code 2.x
        OS: Windows 11
        Python: 3.12.4
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked whether the tree I edited is one that is regenerated by `python sync-all.py` — editing a generated tree raises no error and changes nothing on the next sync.
          required: true
        - label: I have not pasted any secret, access token, customer name, employer name or absolute home path into this report.
          required: true
