# Continuous integration for a repository whose deliverable is prompt-defined
# agent definitions. There is no application and no unit-test suite, so the
# checks below are what stands in for one.
#
# This workflow is designed to run unmodified on a fork with no repository
# secret configured. It references no `secrets.*` at all — not even the
# automatic `GITHUB_TOKEN`, because nothing here needs to call the API. The
# only token in play is the one Actions injects for `actions/checkout`, and
# `permissions:` below narrows it to read-only.
#
# Two rules govern what is allowed to be a live step here:
#
#   1. Only wire a command that exists. A step invoking a script that is not
#      in the tree fails on arrival for a reason unrelated to the commit, and
#      a CI file that does that trains people to ignore it. Steps for tools
#      that are still being built are commented out below, each naming the
#      change that introduces it.
#
#   2. A gate has to be capable of failing. Every live step here was run
#      against a deliberately broken tree before it was committed, and the
#      failure observed. One validator that exists — `verify-bodies.py` —
#      is NOT wired live, because it prints its failures and then exits 0;
#      see the commented block in the `validate` job for the detail.
#
# Third-party actions are pinned to a full commit SHA rather than a tag,
# because a tag is mutable and a moved tag is a silent supply-chain change.
# The tag each SHA corresponded to on 2026-09-02 is in the trailing comment;
# re-resolve it before bumping, do not trust the comment.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing in this workflow writes to the repository, comments on a
# pull request, or publishes an artifact, so nothing needs more than this.
permissions:
  contents: read

# A superseded run on the same ref is wasted compute and a slower signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Definitions and registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the working tree
        # Default fetch-depth of 1 is deliberate: every check in this job reads
        # the tree as it stands, not its history.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Documented counts match the tree
        # Every README here has at some point asserted a count that later
        # stopped being true. This is the check that stops that recurring.
        run: python sdlc-suite/tools/counts.py --check

      - name: Definitions are LF, measured on the bytes
        # Five agents once silently stopped registering — dispatch failed with
        # "agent type not found" — and every one had CRLF in its frontmatter.
        #
        # This asserts on `b"\r\n" in path.read_bytes()`, not on
        # `git ls-files --eol` and not on `file -b`. The index attribute
        # reports what git would store, not what is on disk, and `file -b`
        # reports "JSON text data" for a CRLF JSON file. Only the bytes
        # describe the case that actually reaches a harness.
        run: python sdlc-suite/tools/eol_check.py --check

      - name: Autonomy policy validates against its schema
        run: python sdlc-suite/tools/validate-autonomy.py sdlc-suite/autonomy.json

      - name: Workflow scripts compile
        # NOT `node --check`. Measured on Node v26.1.0: it exits 0 on a dropped
        # brace, an unterminated string, an unterminated block comment, top-level
        # await and blatant garbage — for every file here — because each begins
        # `export const meta = {`, which triggers ESM detection and defers the
        # parse. It was wired as this job's only syntax gate for two trees and
        # was inert on all of them. Independent review caught it by running it
        # against a deliberately broken file, which is what rule 2 in this
        # header requires and what did not happen the first time.
        #
        # `syncheck.mjs` compiles via the host's own path instead, detects the
        # CommonJS dialect that commandcode-suite uses, and carries a --selftest
        # that proves it can fail before any green result from it is trusted.
        run: |
          node sdlc-suite/tools/syncheck.mjs --selftest
          node sdlc-suite/tools/syncheck.mjs             sdlc-suite/workflows .claude/workflows commandcode-suite/workflows

      - name: Runtime wiring, per workflow tree
        # `_wiring.test.js` defaults to `sdlc-suite/workflows` and accepts
        # `--src`. CI never passed it, so the suite reported 60/60 green while
        # `.claude/workflows` — the live tree for bare-name invocation here —
        # carried none of the CHG-16..22 wiring for six commits. Both trees are
        # named explicitly; a tree absent from this list is a tree nothing checks.
        run: |
          node sdlc-suite/workflows/_wiring.test.js --src sdlc-suite/workflows
          node sdlc-suite/workflows/_wiring.test.js --src .claude/workflows

      - name: Runtime module tests
        shell: bash
        run: |
          set -euo pipefail

          # The shared workflow modules have real test suites. They use no test
          # framework — this repository has no package.json, so a framework would
          # be a new runtime dependency for every adopter — and signal the result
          # through the exit code.
          #
          # Each suite's assertions were shown to fail before the code they cover
          # existed. Three of them encode defects found that way rather than by
          # review: `\Z` matching a literal Z in a JS regex, JSON.stringify
          # escaping the newlines a multiline match needed, and a breaker that
          # counted retry attempts tripping on one agent's own designed policy.
          for t in sdlc-suite/workflows/*.test.js; do
            echo "--- $t"
            node "$t"
          done
          echo "--- .kimi-code/workflows/test_runner.py"
          python .kimi-code/workflows/test_runner.py

      - name: Autonomy schema and its JS mirror agree
        # Two implementations of one spec drift. This reads the gate names out of
        # `_policy.js` rather than restating them, so it cannot pass by agreeing
        # with a copy of itself.
        run: python sdlc-suite/tools/validate-autonomy.py --selftest

      - name: commandcode-suite structure
        run: python commandcode-suite/validate.py

      - name: .kimi-code structure
        run: python .kimi-code/validate.py

      # `commandcode-suite/verify-bodies.py` used to print "BODY MISMATCH: <file>"
      # for each divergence and then exit 0 — wired plainly it was a permanently
      # green step, the exact decorative gate rule 2 above exists to prevent.
      # It now exits 1 on mismatch and 2 on a zero-file scan, and it compares
      # bytes rather than universal-newline-translated text, so it is wired live.
      # Proven capable of failing: appending one line to a generated agent body
      # makes it exit 1 naming that file.
      - name: commandcode-suite agent bodies match sdlc-suite
        run: python commandcode-suite/verify-bodies.py

      # Every tree but `sdlc-suite/` is generated. This is the check that makes
      # editing the wrong copy an error instead of a silent no-op. Proven capable
      # of failing: hand-editing one generated file makes it exit 1 naming the tree.
      - name: Generated trees are in sync with sdlc-suite
        run: python sdlc-suite/tools/generate_trees.py --check

      # ---------------------------------------------------------------------
      # Not yet live.
      # ---------------------------------------------------------------------
      #
      # `sdlc-suite/tools/validate.py` does not exist in any form. CHG-08
      # introduces the repository-wide registry validator that replaces the
      # two per-tree `validate.py` scripts wired above.
      #
      # - name: Registry structure (all trees)
      #   run: python sdlc-suite/tools/validate.py --all-trees

  versioning:
    name: Versions and release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the working tree with history
        # `fetch-depth: 0`, unlike the `validate` job above, whose depth of 1 is
        # deliberate because every check in it reads the tree as it stands. This
        # job has to compare an agent body against the base branch, so it needs
        # history. That difference is the whole reason this is a separate job
        # rather than three more steps up there.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Version rules can still fail
        # Wiring `bump.py --check` is only worth anything while its rules are
        # alive. This drives each one to red and back to green against synthetic
        # before/after pairs, with no git and no filesystem, so it also runs
        # meaningfully on a push where the diff is empty.
        #
        # Proven capable of failing: replacing the `version-not-moved` branch
        # with `if False:` makes it exit 1 naming the two cases that stopped
        # firing, and it returns to 0 when the branch is restored.
        run: python sdlc-suite/tools/bump.py --selftest

      - name: marketplace.json matches plugin.json
        # The plugin version lived in `plugin.json` and in `marketplace.json`
        # and was bumped by hand in both. `plugin.json` is now the single
        # source; `marketplace.json` is generated from it, keeping its own
        # description and keywords, which legitimately differ.
        #
        # Proven capable of failing: setting `marketplace.json` to 1.0.2 against
        # `plugin.json` 1.0.3 exits 1 and prints both. The first draft of the
        # renderer skipped a plugin entry whose manifest it could not resolve
        # and so reported "in sync" over exactly that desync — an unresolvable
        # entry is now an error, which is why this step is trusted at all.
        run: python sdlc-suite/tools/bump.py --marketplace --check

      - name: Versions move with content
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # On a pull request the comparison is against the base branch, since
          # the question is what this change did to an agent or skill body.
          #
          # On a push to main there is no base branch, the working tree equals
          # HEAD, and the diff is therefore empty. That is a pass, and not a
          # vacuous one: the tree-state rules still run on every artifact —
          # each carries a well-formed `version:`, and the plugin's MAJOR is at
          # least the highest artifact MAJOR.
          if [ -n "${BASE_REF:-}" ]; then
            # Fetched by refspec rather than assumed to exist already under a
            # remote-tracking name. A base that does not resolve exits 2 with a
            # message naming the ref — that is the "fails for a reason unrelated
            # to the commit" case rule 1 at the top of this file warns about, so
            # it is made unambiguous rather than left to a stack trace.
            git fetch --no-tags --quiet origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            python sdlc-suite/tools/bump.py --check --base "origin/${BASE_REF}"
          else
            python sdlc-suite/tools/bump.py --check
          fi

  secrets:
    name: Secret and identifier scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the working tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install gitleaks
        shell: bash
        env:
          # Pinned version plus the published SHA-256 of that exact asset. A
          # release asset can be replaced; downloading and running an
          # unverified binary in CI is how a pipeline gets compromised. The
          # checksum is the thing that makes this safe, not the version pin.
          GITLEAKS_VERSION: '8.28.0'
          GITLEAKS_SHA256: 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb'
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --retry 3 \
               --output "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          # Extracted into RUNNER_TEMP, never the workspace, so the binary and
          # the tarball are not themselves part of the tree being scanned.
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # The binary is used directly rather than `gitleaks/gitleaks-action@v2`
      # for two reasons. It can be run locally, so the config's rules and
      # allowlists can each be proven to fire and to be excused before they
      # are committed — an action cannot. And it needs no token whatsoever,
      # which satisfies "runs on a fork with no secret" by construction.
      # `--verbose` because without it a failing run prints only
      # "leaks found: N" — no rule, no file, no line — which is not something
      # a contributor can act on.
      #
      # `--redact` because this repository is public and so are its Actions
      # logs. An unredacted finding would publish the exact secret the scan
      # just caught, in a log that outlives the branch. Checked on
      # gitleaks 8.28.0: with both flags set the output carries RuleID, File
      # and Line, and the secret itself appears zero times.
      - name: Scan the working tree
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --verbose \
            --exit-code 1 \
            .

      # Deliberately a working-tree scan, not a history scan.
      #
      # `gitleaks git` would additionally catch a secret added in one commit
      # of a pull request and removed in a later one — a real gap that this
      # job does not close, and worth knowing about.
      #
      # It is not enabled because it would be red on arrival and could only be
      # made green by a second history rewrite: the hardcoded home paths that
      # CHG-04 has just removed are still present in earlier commits, and
      # `.gitleaks.toml` would flag every one of them. The published history
      # was already confirmed clean of credentials before this change, so the
      # residual risk is the add-then-remove-within-one-PR case above.
      #
      # If the history is ever rewritten again, enable this and set
      # `fetch-depth: 0` on the checkout step above. It still needs no secret.
      #
      # - name: Scan history
      #   run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --no-banner --redact --exit-code 1 .'
