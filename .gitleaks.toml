# Gitleaks configuration for this repository.
#
# Two jobs. The first is the ordinary one: catch a credential before it is
# committed, using the upstream default rules. The second is specific to this
# repository. This tree was published after a history purge (CHG-01) and two
# content sweeps (CHG-03 private design records, CHG-04 hardcoded home paths).
# Those were one-time cleanups. The rules below turn them into invariants, so
# the same class cannot come back in a later commit without CI saying so.
#
# Four things to know before editing. Each was measured against gitleaks
# 8.28.0 on 2026-09-02, not assumed. scripts/test_gitleaks_rules.py proves
# every rule and allowlist against fixtures; run it after any edit here.
#
#   1. Never answer a false positive with `disabledRules`. Disabling is global
#      and silent: the rule stops firing everywhere and nothing in a later diff
#      shows that it did. A path-scoped allowlist is local, reviewable, and
#      names the file it excuses. Every allowlist below is scoped by path.
#
#   2. Allowlists here are rule-level (`[[rules.allowlists]]`), never global
#      (`[[allowlists]]` plus `targetRules`). This is not a style preference.
#      With `[extend] useDefault = true` set, a global allowlist carrying
#      `targetRules` parses without error and is then SILENTLY IGNORED - the
#      rule fires on the very file the allowlist named. The rule-level form
#      works. Both were run against the same fixture before this was written.
#      (2026-10-31: gitleaks 8.30.1 does honour the global form; rule-level
#      stays, as it works on both. A rule-level allowlist with both `regexes`
#      and `paths` needs `condition = "AND"`, see the project-name rule.)
#
#   3. Custom rules deliberately carry no `keywords`. `keywords` is a
#      lowercased pre-filter: a rule that has one only evaluates its regex on
#      fragments containing it, so a wrong keyword disables the rule with no
#      error at all. The scan is fast enough here without them.
#
#   4. Scope allowlists by EXACT FILENAME, never by directory. `docs/**` would
#      mean the next document added there leaks silently, which is the failure
#      this whole file exists to prevent. Adding a third excused file is a
#      deliberate edit here with a stated reason, not a wildcard.
#
# Run locally with:
#   gitleaks dir --config .gitleaks.toml --no-banner --redact .

title = "agents - upstream defaults plus this repository's own identifiers"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Repository identifier rules
# ---------------------------------------------------------------------------

# The employer-name rule is NOT here, on purpose. Until 2026-11-13 this file
# carried `agents-employer-name`, whose regex spelled the author's employer, and
# it was the only file in the tree that did: the config whose job was to keep
# the name out of a public repository was publishing it. A literal-match rule
# cannot detect a string without containing it, and gitleaks has no hashed or
# external pattern, so the rule now lives where the name is allowed to be: an
# untracked local config layered on this one.
#
#   cp .gitleaks.local.example.toml .gitleaks.local.toml   # gitignored
#   # put the real name(s) in its regex, then scan with:
#   gitleaks dir --config .gitleaks.local.toml --no-banner --redact .
#   # or, as a pre-commit check of what is staged:
#   gitleaks git --pre-commit --staged --config .gitleaks.local.toml --no-banner --redact
#   # or make the `.pre-commit-config.yaml` hook use it (gitleaks reads
#   # GITLEAKS_CONFIG when no --config is given; checked on 8.30.1):
#   export GITLEAKS_CONFIG=.gitleaks.local.toml
#
# `.gitleaks.local.toml` extends this file (`[extend] path`), so the upstream
# defaults and every rule below still apply through it. The cost is stated: CI
# no longer checks for the name, so a contributor without the local config is
# unguarded against it. `redaction/denylist.txt` (also gitignored) does the same
# job for the learning loop's published files. The same layering is what a fork
# should use for its own organisation's name.
[[rules]]
id = "agents-private-project-name"
description = "Private project codename - a separate unreleased repository these agents build against, not a component of this one"
regex = '''(?i)\b(?:snagit[-_ ]?clone|nawi(?:[-_]vex)?)\b'''
tags = ["repo-identifier", "private-project", "chg-03"]
  [[rules.allowlists]]
  description = "Only the two names that are ALREADY public, and only in the documents that must discuss them. Independent review caught the earlier version of this allowlist excusing the whole review document from every identifier rule - which would have published the employer name, the author's email, both home paths, the product codename and the requirement-id taxonomy, in the commit titled 'make the repository publishable', with the scanner told to stay quiet. Measured on origin/main before deciding: nawi appears in 4 files and snagit-clone in 3, deliberately, because .gitignore cannot exclude a directory without naming it and CLAUDE.md explains why it is excluded. The product's own pre-rename codename appeared in 0 and the requirement-id taxonomy in 0, so both were REDACTED from the documents rather than excused here — and the codename is dropped from this rule's pattern too, because spelling it out in a public config republishes the string the redaction removed. The project is now `nawi`, which the pattern does still carry. The distinction is the point: excuse what is already public, redact what is not."
  # AND: excused only when the match is one of these names AND the file is
  # one of these paths. Without it gitleaks ORs the two lists, and since the
  # regex matches every hit this rule can produce, the rule excused the names
  # in EVERY file - dead from the day it was written, with a green job on top
  # (measured 2026-10-31 on 8.28.0 and 8.30.1). scripts/test_gitleaks_rules.py
  # now proves it fires.
  condition = "AND"
  regexTarget = "match"
  regexes = [
    '''(?i)^(?:snagit[-_ ]?clone|nawi(?:[-_]vex)?)$''',
  ]
  paths = [
    '''(^|/)docs/platform-review-2026-09-01\.md$''',
    '''(^|/)docs/platform-review-2026-09-01-corrections\.md$''',
    '''(^|/)\.gitignore$''',
    # Four more files where naming the project is structurally required, each
    # excused by exact path and from this rule only. Measured 2026-09-02 by
    # simulating every rule over the whole tree: without these, 20 hits in 6
    # files make the job red on arrival, and a job that is red for a reason
    # unrelated to the commit is how a gate gets ignored.
    #
    #   CLAUDE.md      - explains, deliberately, why the directory is ignored.
    #                    The explanation cannot omit the name it explains.
    #   CHANGELOG.md   - records that the private records were REMOVED. A
    #                    changelog that cannot say what it removed is useless.
    #   eol_check.py   - carries the directory in its don't-descend list.
    #   validate-autonomy.py - same, in its repo-walk filter.
    #
    # A real credential in any of them still fails the scan; only this one
    # rule is excused, and only on these paths.
    '''(^|/)CLAUDE\.md$''',
    '''(^|/)CHANGELOG\.md$''',
    '''(^|/)sdlc-suite/tools/eol_check\.py$''',
    '''(^|/)sdlc-suite/tools/validate-autonomy\.py$''',
  ]
[[rules]]
id = "agents-absolute-home-path"
description = "Absolute home directory path - machine-specific, unusable by anyone else, and it leaks a real account name"
regex = '''(?i)(?:[a-z]:[\\/]{1,2}users[\\/]{1,2}|/users/|/home/)([a-z0-9._][a-z0-9._-]{0,62})'''
secretGroup = 1
tags = ["repo-identifier", "home-path", "chg-04"]
  [[rules.allowlists]]
  description = "Placeholder account names. CHG-04's fix replaces each real path with a placeholder plus a substitute-your-own-path sentence, so the rule must not fire on the fix itself. These regexes match the extracted account name (secretGroup 1), not the whole path. Delimiter-style placeholders (<you>, dollar-brace USER, percent USERPROFILE percent) need no entry and must not be given one: the account-name group starts [a-z0-9._], so the rule cannot produce them as a secret at all, and an entry for them would be an allowlist nothing reads. Verified 2026-09-02, gitleaks 8.28.0 - with this regex stripped, /home/username and /Users/you both fire; with it present, neither does."
  regexTarget = "secret"
  regexes = [
    '''(?i)^(you|your|yourname|youruser|username|user|me|someone|example|placeholder|adopter|name|home)$''',
  ]
[[rules]]
id = "agents-vex-requirement-id"
description = "Requirement identifier from the private project's specification (DEC-VEX.1, FR-VEX.1-14, NFR-VEX.2, AE-VEX.2)"
regex = '''\b[A-Za-z]{1,6}-VEX\.[0-9A-Za-z]'''
tags = ["repo-identifier", "private-project", "chg-03"]
